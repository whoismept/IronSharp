name: Maintenance purge

# One-shot: delete a superseded release and its tag. Manual dispatch only.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete release v1.4.0 and its tag
        run: |
          if gh release delete v1.4.0 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null; then
            echo "deleted release+tag v1.4.0"
          else
            echo "no release v1.4.0"
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.4.0" >/dev/null 2>&1 && echo "tag ref removed" || echo "tag ref absent"
