name: Cleanup old build artifacts

# Prunes stale GitHub Actions build artifacts only. Releases are kept as
# history (the rolling 'latest' release is refreshed by publish-latest.yml).
on:
  schedule:
    - cron: "23 4 2 * *"
  workflow_dispatch:
    inputs:
      keep:
        description: "How many most-recent artifacts to keep"
        required: false
        default: "5"

permissions:
  actions: write

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP: ${{ github.event.inputs.keep || '5' }}
    steps:
      - name: Prune old build artifacts (keep the newest $KEEP)
        shell: bash
        run: |
          set -euo pipefail
          echo "Keeping the $KEEP most recent artifacts."
          mapfile -t ids < <(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[].id')
          echo "Found ${#ids[@]} artifact(s)."
          i=0
          for id in "${ids[@]}"; do
            i=$((i + 1))
            if [ "$i" -le "$KEEP" ]; then
              echo "keep   #$i  artifact $id"
            else
              echo "delete #$i  artifact $id"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            fi
          done
