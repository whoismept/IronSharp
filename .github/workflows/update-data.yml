name: Update CVE dataset

on:
  schedule:
    # Monthly, a few days after Patch Tuesday (15th, 06:00 UTC).
    - cron: "0 6 15 * *"
  workflow_dispatch:
    inputs:
      months:
        description: "How many recent months to pull from MSRC"
        required: false
        default: "24"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh dataset from MSRC
        run: python tools/update_cve_data.py --months "${{ github.event.inputs.months || 24 }}"

      - name: Commit changes if any
        run: |
          if [ -n "$(git status --porcelain IronSharp/Data/cve-data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add IronSharp/Data/cve-data.json
            git commit -m "data: refresh cve-data.json from MSRC CVRF"
            git push
          else
            echo "No changes to commit."
          fi
