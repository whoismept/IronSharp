name: Update CVE dataset

on:
  schedule:
    # Every Wednesday 12:00 UTC; the job itself only proceeds on the Wednesday
    # right after Patch Tuesday (day-of-month 9-15 is the week's only Wednesday).
    - cron: "0 12 * * 3"
  workflow_dispatch:
    inputs:
      months:
        description: "How many recent months to pull from MSRC"
        required: false
        default: "24"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate scheduled runs to the Wednesday after Patch Tuesday
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            dom=$(date -u +%d)
            if [ "$dom" -lt 9 ] || [ "$dom" -gt 15 ]; then
              echo "Day-of-month $dom is not Patch Tuesday week; skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Refresh dataset from MSRC
        if: steps.gate.outputs.run == 'true'
        run: python tools/update_cve_data.py --months "${{ github.event.inputs.months || 24 }}"

      - name: Commit changes if any
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -n "$(git status --porcelain IronSharp/Data/cve-data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add IronSharp/Data/cve-data.json
            git commit -m "data: refresh cve-data.json from MSRC CVRF"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Refresh dataset asset on the latest release
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep --online (which reads the latest release's asset) current.
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$tag" ]; then
            gh release upload "$tag" IronSharp/Data/cve-data.json --repo "$GITHUB_REPOSITORY" --clobber
            echo "Updated cve-data.json asset on release $tag."
          else
            echo "No release found; skipping asset refresh."
          fi
